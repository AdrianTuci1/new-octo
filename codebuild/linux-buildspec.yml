version: 0.2
env:
  shell: bash
phases:
  install:
    commands:
      - set -euo pipefail
      - export DEBIAN_FRONTEND=noninteractive
      - apt-get update
      - apt-get install -y curl unzip zip file build-essential pkg-config libssl-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev
      - if [ ! -x "$HOME/.cargo/bin/cargo" ]; then curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal; fi
      - . "$HOME/.cargo/env"
      - rustup toolchain install stable --profile minimal
      - rustup default stable
  pre_build:
    commands:
      - npm ci
      - if [ -n "${TAURI_SIGNING_PRIVATE_KEY_B64:-}" ]; then export TAURI_SIGNING_PRIVATE_KEY="$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY_B64" | base64 -d)"; fi
      - if [ -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD_B64:-}" ]; then export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD_B64" | base64 -d)"; fi
  build:
    commands:
      - . "$HOME/.cargo/env"
      - npx tauri build --runner "$HOME/.cargo/bin/cargo" --bundles "$RELEASE_BUNDLES"
      - mkdir -p release-output
      - find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -exec cp {} release-output/ \;
      - find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage.sig' -exec cp {} release-output/ \;
      - find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -exec cp {} release-output/ \;
artifacts:
  base-directory: release-output
  files:
    - '**/*'
  discard-paths: yes
