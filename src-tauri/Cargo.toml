[package]
name = "octomus_launcher_prototype"
version = "0.1.0"
description = "Rust + React prototype for the Octomus main launcher"
authors = ["OpenAI Codex"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
derivative = "2.2.0"
futures-lite = "2.6.1"
futures-util = "0.3"
itertools = "0.14.0"
lazy_static = "1.5.0"
log = "0.4.29"
portable-pty = "0.8"
rangemap = "1.7.1"
regex = "1.12.3"
reqwest = { version = "0.12", features = ["json", "stream", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "3.1.0"
strsim = "0.11.1"
tauri = { version = "2.0.0", features = ["macos-private-api", "tray-icon"] }
tokio = { version = "1.0", features = ["rt-multi-thread"] }
uuid = { version = "1.0", features = ["serde", "v4"] }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "2.0.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
