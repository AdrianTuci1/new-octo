[package]
name = "octomus-ui"
version = "0.1.0"
edition = "2021"
description = "Native egui UI for Octomus"

[[bin]]
name = "octomus-ui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", features = ["default"] }
egui = "0.31"
egui_extras = "0.31"
syntect = "5.2"
tray-icon = "0.19"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "sync"] }
rand = "0.10.1"
regex = "1.10"
pulldown-cmark = "0.13.4"
lazy_static = "1.5.0"
